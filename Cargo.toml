[package]
name = "axum-typed-websockets"
version = "0.6.0"
authors = ["David Pedersen <david.pdrsn@gmail.com>"]
categories = ["asynchronous", "network-programming", "web-programming"]
description = "axum::extract::ws with type safe messages"
edition = "2024"
rust-version = "1.86"
keywords = ["http", "web", "framework"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/davidpdrsn/axum-typed-websockets"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["json"]
json = ["serde_json"]
msgpack = ["rmp-serde"]
bitcode = ["dep:bitcode"]
cbor = ["dep:ciborium"]
postcard = ["dep:postcard"]
ron = ["dep:ron"]
flexbuffers = ["dep:flexbuffers"]
bson = ["dep:bson"]
xml = ["dep:quick-xml"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = "1.0"
serde_json = { version = "1.0", optional = true }
rmp-serde = { version = "1.3", optional = true }
bitcode = { version = "0.6", optional = true, default-features = false, features = ["serde", "std"] }
ciborium = { version = "0.2", optional = true }
postcard = { version = "1.1", optional = true, default-features = false, features = ["alloc"] }
ron = { version = "0.12", optional = true }
flexbuffers = { version = "25.12", optional = true }
bson = { version = "3.1", optional = true, features = ["serde"] }
quick-xml = { version = "0.42", optional = true, features = ["serialize"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = "0.29"
axum = { version = "0.8", features = ["ws"] }
