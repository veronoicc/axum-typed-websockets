[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
# Optional codec crates (flexbuffers, bson) pull in older copies of a few
# common crates; flag them without failing the build.
multiple-versions = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
